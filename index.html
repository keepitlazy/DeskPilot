<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeskPilot</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">D</div><div><strong>DeskPilot</strong><small>本机 AI 助手</small></div></div>
        <button id="new-chat" class="new-chat"><span>＋</span> 新建会话</button>
        <div class="section-label">最近会话</div>
        <nav id="conversation-list" class="conversation-list" aria-label="会话列表"></nav>
        <div class="sidebar-footer"><span class="status-dot"></span> 本地演示模式</div>
      </aside>
      <main class="main-panel">
        <header class="topbar"><div class="breadcrumb"><span>工作区</span><span class="slash">/</span><strong id="conversation-title">新会话</strong></div><div class="topbar-right"><span class="model-pill"><i></i> DeskPilot Preview</span><button class="icon-button" aria-label="更多选项">···</button></div></header>
        <section id="message-list" class="message-list" aria-live="polite"></section>
        <section class="composer-area">
          <div id="task-banner" class="task-banner" hidden></div>
          <div class="composer-wrap"><textarea id="message-input" rows="1" placeholder="给 DeskPilot 发送消息…" aria-label="消息内容"></textarea><div class="composer-controls"><div class="composer-hint"><span>Enter 发送</span><span>·</span><span>Shift + Enter 换行</span></div><button id="send-button" class="send-button" aria-label="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12 20 4l-4.2 16-3.1-6.7L4.5 12Zm8.2 1.3 4.7-5.1"/></svg></button></div></div>
          <div class="privacy-note"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 13 3.4v3.8c0 3.2-2 5.8-5 7.3-3-1.5-5-4.1-5-7.3V3.4L8 1.5Z"/><path d="m5.8 7.8 1.5 1.5 3-3"/></svg>你的对话保留在本机。发送文件内容前会先征求你的确认。</div>
        </section>
      </main>
    </div>
    <script src="dist/renderer.js"></script>
  </body>
</html>
